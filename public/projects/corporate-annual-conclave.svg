<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="60%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#2B080A"/>
    </linearGradient>
    <radialGradient id="spot1" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#D71920" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect width="800" height="500" fill="url(#spot1)"/>
  <!-- Stage Rigging & Truss -->
  <path d="M0 80h800M0 110h800" stroke="#333333" stroke-width="2" opacity="0.5"/>
  <path d="M50 80l30 30M110 80l30 30M170 80l30 30M230 80l30 30M290 80l30 30M350 80l30 30M410 80l30 30M470 80l30 30M530 80l30 30M590 80l30 30M650 80l30 30M710 80l30 30" stroke="#444" stroke-width="1.5" opacity="0.5"/>
  <!-- Stage Beams -->
  <polygon points="180,110 400,380 340,380" fill="#D71920" opacity="0.15"/>
  <polygon points="620,110 400,380 460,380" fill="#D71920" opacity="0.15"/>
  <polygon points="400,110 320,380 480,380" fill="#FFFFFF" opacity="0.08"/>
  <!-- LED Backdrop Screen -->
  <rect x="220" y="180" width="360" height="180" rx="8" fill="#1E1E1E" stroke="#D71920" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ANNUAL LEADERSHIP CONCLAVE</text>
  <text x="400" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D71920" text-anchor="middle" letter-spacing="4">KEYNOTE STAGE &amp; PRODUCTION</text>
  <!-- Stage Podiums -->
  <polygon points="120,440 680,440 730,500 70,500" fill="#161616" stroke="#262626" stroke-width="2"/>
  <polygon points="200,380 600,380 630,440 170,440" fill="#1C1C1C" stroke="#333333" stroke-width="1"/>
  <circle cx="400" cy="340" r="8" fill="#D71920" opacity="0.8"/>
</svg>